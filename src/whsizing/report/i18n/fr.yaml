# ---- Annexe B : formules (traduites ; les symboles et les identifiants de formule restent les mêmes qu'en anglais)
"methodology.formulas": |
  # Demande et jour de dimensionnement (F3, F4)
  jour ouvré            : lignes_j ≥ max(1, 0,10 × médiane(lignes_j > 0)), hors jour férié sans volume
  peak_to_avg           : P95(lignes_j) / moyenne(lignes_j)                          (jours ouvrés)
  monthly_index_m       : moyenne(lignes_j | mois m) / moyenne(lignes_j)
  trend_cagr            : exp(12 × pente(log lignes_mensuelles ~ indice_du_mois)) − 1
  D*                    : P_p(lignes_j, fenêtre glissante) ;  m* = D* × (m_r / lignes_r), r = jour le plus proche de P_p
  croissance            : indicateurs de capacité × (1+g)^T ;  coûts annuels × (1+g)^t
  hourly_lines_h        : intrajournalier[jour de la semaine retenu][h] × lignes*
  réceptions (dérivées) : unités_reçues = moyenne unités_sorties × (1+g)^T + Δstock/an ÷ jours_ouvrés
                          palettes_reçues = Σ_réf unités_reçues_réf / unités_par_palette_réf ; camions = palettes_reçues / palettes_par_camion

  # Stockage (F6a)
  pallets_i             : ceil(s_i / unités_par_palette_i) ;  positions_palette = Σ pallets_i / remplissage_palette
  bins_i                : max(1, ceil(s_i × v_i / (volume_net_bac × remplissage)))
  niveaux               : floor((H_libre − sur-hauteur) / pas_de_niveau), plafonné par max_levels / limite ergonomique
  area_class            : positions / (niveaux × positions_par_m2_par_niveau)    (la densité inclut les allées)

  # Débit et équipements (F6b)
  λ                     : max(lignes_heure_de_pointe / η_flow, lignes_du_jour / heures_fenêtre_sla)
  λ_e                   : λ × part_lignes_éligibles ;  λ_o = λ − λ_e
  postes / ports        : ceil(λ_e / (cadence × TRS))
  robots (AMR)          : ceil(λ_e / lignes_par_visite_de_pod / (déplacements_robot_h × disponibilité) × (1 + réserve_de_charge))
  robots (cube)         : ceil(λ_e / lignes_par_présentation_de_bac × facteur_dig / (bacs_robot_h × disponibilité))
  préparateurs (manuel) : ceil(λ / (cadence_picking × η_pick))

  # Main-d'œuvre (F6c)
  hours_a               : charge_a / productivité_a × (1 + PF&D)
  heads_a               : hours_a / (heures_payées_par_personne_jour × taux_d_utilisation)
  roster                : Σ_équipe heads_équipe × (1 + absentéisme)
  annual_hours_{a,t}    : Σ_j charge_{a,j} × (1+g)^t / productivité_a × (1 + PF&D)      (série journalière)
  core_fte_t            : annual_hours_t / (heures_payées_annuelles_par_ETP × taux_d_utilisation)
  temp_hours_t          : Σ_j max(0, hours_j − capacité_interne_jour)

  # Surfaces et quais (F6d)
  surfaces par zone     : voir F6d ;  circulation = part × Σ zones hors stockage
  fit                   : total ≤ surface du bâtiment ;  déficit = max(0, total − surface)
  quais                 : ceil(camions_heure_de_pointe × durée_d_immobilisation_h / taux_d_utilisation_quai)

  # File d'attente (F6e)
  récurrence d'Erlang-B : B_0 = 1 ; B_k = a B_{k−1} / (k + a B_{k−1})
  Erlang-C              : P_attente = B_c / (1 − ρ + ρ B_c), ρ = a / c
  W_q                   : P_attente / (cμ − λ) ;  P(W > t) = P_attente × exp(−(cμ − λ) t)

  # Finance (F7)
  capex                 : stockage + équipement + contrôle-commande + travaux du bâtiment + débordement + (intégration + mise en service) × équipement + aléas
  opex_t                : main-d'œuvre_t + maintenance + énergie_t + logiciels + consommables_t + loyer + renouvellement_t
  TCO                   : capex + Σ_t opex_t / (1+r)^t
  Δcf_0                 : −(capex_s − capex_b) ;  Δcf_t = opex_b,t − opex_s,t
  VAN                   : Σ_t Δcf_t / (1+r)^t ;  TRI : racine de VAN(r*) = 0 si elle existe
  retour sur invest.    : premier t tel que Σ_{k≤t} Δcf_k ≥ 0, interpolé dans l'année
  cost_per_line         : TCO × r / (1 − (1+r)^−T) / lignes_annuelles_1

  # Calage (F11)
  objectif              : Σ_i w_i (prév_i(θ) − réel_i)² + λ Σ_j ((θ_j − a_priori_j)/σ_j)²,  min_j ≤ θ_j ≤ max_j
  θ                     : multiplicateurs de productivité par activité, η_flow, PF&D
  validation            : calage sur les 9 premiers mois, évaluation sur les 3 derniers (doivent contenir le mois de pointe)

