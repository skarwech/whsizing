# whsizing Streamlit wrapper (F10b): client data stays on this machine.
[browser]
gatherUsageStats = false  # no telemetry (Streamlit Community Cloud sets its own value for a hosted app)

[server]
# MB. The hosted demo has no uploader, but Streamlit serves its upload route all the same and keeps
# what a client sends in memory (with a cap of 1, 300 requests of 0.9 MB were kept: +283 MB). With
# 0 the route refuses every non-empty body (413; an empty upload sent in chunks is still recorded:
# about 4 KB of metadata per request). `just app` (the full app) passes --server.maxUploadSize
# 1024; larger files: use `whsizing ingest` (the CLI).
maxUploadSize = 0
# No `address` here, on purpose. `just app` passes --server.address 127.0.0.1 (the full app has no
# authentication, and shows an error instead of its pages on a reachable address:
# state.exposed_without_auth), while
# the public demo (streamlit_app.py, synthetic data) must be reachable by the platform that hosts it.
