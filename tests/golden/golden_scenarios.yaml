# rack, 1 with zero stock (no position, I14).
# The family-level keys eligibility.cube_asrs.* keep the default EligibilityCfg (T5.3); the
# scenario's shares are S2.eligibility.* (docs/INTERPRETATIONS.md I44).
scenarios:
  - {id: S0, name: "Manuel picker-to-parts", family: manual_p2p, is_baseline: true}
  - {id: S2, name: "AS/RS cube", family: cube_asrs, eligibility: {assume_eligible_if_missing_dims: false, extra_max_weight_kg: 2.0}}
baseline: S0
