# Golden case (F1): 100 SKUs, ≈ 1,000 orders over 31 days, no defects. Hand-checked by the
# golden spreadsheet (T1.5), so this file and the seed (42) are frozen: any change regenerates
# tests/golden/tiny_golden/ and invalidates the spreadsheet.
#
# Tuned against the [P] defaults (why):
# - start_date 2025-03-01, n_days 31: one calendar month without French public holidays.
# - orders_per_day_mean 46: Σλ_d = 46 × 0.9 (March index) × Σ weekday weights over March 2025
#   (23.9) × growth ≈ 991 expected orders.
# - sigma_log_mm 0.7 (default 0.5): puts ~9 SKUs outside the cube_asrs envelope
#   [600, 400, 300] mm so eligibility and overflow are exercised.
# - days_of_cover 60 (default 25): at this tiny volume, 25 days of cover leaves only one SKU with
#   ≥ 0.6 m³ of stock; 60 days gives a handful of pallet_rack-class SKUs next to shelving ones.
name: tiny_golden

# Scale
n_skus: 100
start_date: 2025-03-01
n_days: 31
orders_per_day_mean: 46

# SKU master
mu_log_mm: [5.3, 4.9, 4.4]
sigma_log_mm: 0.7
mu_log_kg: -0.7
sigma_log_kg: 0.9
units_per_case_values: [1, 6, 12, 24]
units_per_case_weights: [0.4, 0.3, 0.2, 0.1]
pallet_dims_m: [1.2, 0.8, 1.2]
n_categories: 8

# Popularity
zipf_s: 1.1
inactive_share: 0.10

# Order structure
single_line_prob: 0.55
extra_lines_mean: 2.2
units_per_line_extra_mean: 0.4
cases_per_line_extra_mean: 1.0
channel_shares: {B2C: 1.0}

# Calendar
weekday_weights: [1.15, 1.10, 1.05, 1.00, 0.95, 0.35, 0.0]
month_index: [0.9, 0.85, 0.9, 0.95, 0.95, 0.9, 0.85, 0.75, 0.95, 1.0, 1.4, 1.6]
promos: []
annual_growth: 0.05

# Intraday
hourly_weights: [0.2, 0.1, 0.05, 0.05, 0.05, 0.1, 0.3, 0.6, 1.0, 1.4, 1.8, 1.8,
                 1.3, 1.2, 1.7, 1.6, 1.0, 0.9, 0.9, 0.9, 0.8, 0.7, 0.5, 0.3]
cutoff_hour: 15
cutoff_boost: 1.25

# Flows
returns_rate: 0.04
return_delay_days: [3, 20]
cancel_rate: 0.01
days_of_cover: 60
stock_noise_sigma: 0.2
receipt_hour: 7

defects: {}                       # golden case: no defects
